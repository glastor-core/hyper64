name: Continuous Benchmark & Performance Regression Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Criterion Performance & Regression Monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Criterion Benchmarks
        run: |
          cargo bench --all-features -- --output-format bencher | tee output.txt

      - name: Store & Compare Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: hyper64 Throughput Benchmarks
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          # Alert if throughput regresses by more than 5%
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: true

