name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release & Crates.io Publish
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify tests pass
        run: cargo test --all-features

      - name: Verify clippy passes
        run: cargo clippy --all-targets --all-features -- -D warnings -A unknown-lints -A renamed-and-removed-lints -A clippy::incompatible_msrv -A clippy::chunks_exact_to_as_chunks -A clippy::byte_char_slices

      - name: Verify documentation builds
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Verify package tarball
        run: cargo package

      - name: Determine tag name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            target/package/*.crate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish


