name: Security, SemVer & Binary Hardening Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # 1. API Contract & SemVer Guard via glastor-core/specter
  specter-audit:
    name: API Contract & SemVer Gatekeeper (Specter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Glastor Specter SemVer Differ
        uses: glastor-core/specter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 2. Binary Hardening & Size Regression Audit via glastor-core/byte-gauge
  byte-gauge-audit:
    name: Binary Hardening & Entropy Audit (Byte-Gauge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Artifacts
        run: cargo build --release --all-features

      - name: Run Glastor Byte-Gauge Auditor
        uses: glastor-core/byte-gauge@v1
        with:
          path: target/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 3. Supply Chain, License & Security Advisory Guard via EmbarkStudios/cargo-deny
  cargo-deny:
    name: Supply Chain, License & Advisory Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check
          arguments: --all-features

