name: Continuous Fuzzing & Memory Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer Sanity Run (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_decode
          - fuzz_roundtrip
          - fuzz_pem

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run Fuzz Target with AddressSanitizer
        working-directory: fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -timeout=5

