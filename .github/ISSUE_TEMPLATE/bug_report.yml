name: "🐛 Reporte de Bug"
description: "Reporta un problema técnico, error de compilación o anomalía en GLASTOR® hyper64"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar este problema en **GLASTOR® hyper64**.
        Proporcionar detalles específicos sobre el módulo afectado, la arquitectura del CPU y el entorno de Cargo agiliza la resolución.

  - type: textarea
    id: summary
    attributes:
      label: "Descripción del fallo"
      description: "Explica de forma concisa qué falló o qué comportamiento anómalo se presentó."
      placeholder: "Ejemplo: decode_in_place produce un error de padding inválido en un búfer con dos signos igual..."
    validations:
      required: true

  - type: dropdown
    id: module_area
    attributes:
      label: "Módulo o Componente Afectado"
      description: "¿Qué área de hyper64 presentó el problema?"
      options:
        - "SIMD AVX2 / SSSE3 / NEON (simd.rs)"
        - "Decodificación In-Place / Slices (decode.rs)"
        - "Codificación / Chunks (encode.rs)"
        - "Permissive / PEM / MIME Parser (permissive.rs)"
        - "Modo en Tiempo Constante (constant_time.rs)"
        - "Capa Drop-in Engine (engine.rs)"
        - "Adaptadores de I/O síncrono o Tokio async (io.rs)"
        - "Serde Zero-Copy (serde.rs)"
        - "Evaluación en Tiempo de Compilación const fn (const_fn.rs)"
        - "Compilación en #![no_std]"
        - "Otro / General"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: "Arquitectura y CPU"
      description: "¿En qué hardware o arquitectura ocurrió el problema?"
      options:
        - "x86_64 con AVX2"
        - "x86_64 con SSSE3 (sin AVX2)"
        - "AArch64 (Apple Silicon / ARM64 NEON)"
        - "Arquitectura Big-Endian (s390x)"
        - "Bare-Metal / Embedded (Cortex-M / WebAssembly)"
        - "Otra"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducir"
      description: "Código mínimo reproducible en Rust para replicar el problema."
      placeholder: |
        1. Configurar un búfer con...
        2. Llamar a `hyper64::decode_in_place(...)`
        3. Observar el pánico o resultado inesperado...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Entorno de Ejecución"
      description: "Versión de rustc, sistema operativo y features habilitadas."
      placeholder: |
        - rustc: rustc 1.85.0 (xxxx 2026-xx-xx)
        - OS: Ubuntu 24.04 / Windows 11 / macOS 15
        - Cargo features: default, tokio, serde
    validations:
      required: true
