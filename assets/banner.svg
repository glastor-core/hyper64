<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>

  <!-- Matrix Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Brand Organization Header -->
  <g transform="translate(80, 110)">
    <rect width="48" height="48" rx="12" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6"/>
    <polygon points="28,6 15,26 26,26 20,42 35,21 25,21" fill="url(#primaryGrad)"/>
    <text x="64" y="22" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#00f2fe" letter-spacing="2">GLASTOR® CORE ORGANIZATION</text>
    <text x="64" y="42" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">NEXT-GEN RUST INFRASTRUCTURE</text>
  </g>

  <!-- Headline Title -->
  <g transform="translate(80, 240)">
    <text font-family="'Inter', system-ui, sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="-2">hyper</text>
    <text x="210" font-family="'Inter', system-ui, sans-serif" font-size="78" font-weight="900" fill="url(#accentGrad)" letter-spacing="-2">64</text>
    <text x="315" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="800" fill="#00f2fe" opacity="0.85">⚡</text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="295" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    Ultra-High-Throughput, Zero-Allocation Base64 Engine for Rust
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(80, 345)">
    <!-- Pill 1 -->
    <rect width="180" height="42" rx="21" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    <text x="24" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00f2fe">AVX-512BW (64B)</text>

    <!-- Pill 2 -->
    <rect x="195" width="135" height="42" rx="21" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <text x="220" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff">AVX2 (32B)</text>

    <!-- Pill 3 -->
    <rect x="345" width="170" height="42" rx="21" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <text x="368" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff">WASM SIMD128</text>

    <!-- Pill 4 -->
    <rect x="530" width="160" height="42" rx="21" fill="rgba(0, 255, 135, 0.08)" stroke="rgba(0, 255, 135, 0.3)" stroke-width="1.5"/>
    <text x="552" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00ff87">10–25 GiB/s</text>

    <!-- Pill 5 -->
    <rect x="705" width="145" height="42" rx="21" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <text x="728" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffffff">0-Alloc Heap</text>
  </g>

  <!-- Benchmark Graphic Cards on Right -->
  <g transform="translate(800, 110)">
    <!-- Benchmark Box -->
    <rect width="320" height="230" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5"/>
    
    <text x="24" y="38" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#00f2fe" letter-spacing="1">THROUGHPUT COMPARISON</text>
    <text x="24" y="56" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#64748b">Criterion.rs (64 KiB Payload)</text>

    <!-- Bar 1: hyper64 -->
    <text x="24" y="98" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">hyper64</text>
    <text x="245" y="98" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00f2fe">10.20 GiB/s</text>
    <rect x="24" y="108" width="272" height="18" rx="6" fill="url(#primaryGrad)"/>

    <!-- Bar 2: base64 crate -->
    <text x="24" y="156" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">base64 crate (0.22)</text>
    <text x="252" y="156" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8">2.32 GiB/s</text>
    <rect x="24" y="166" width="62" height="18" rx="6" fill="rgba(255,255,255,0.2)"/>

    <!-- Badge inside card -->
    <rect x="24" y="196" width="105" height="22" rx="4" fill="rgba(0, 255, 135, 0.1)"/>
    <text x="32" y="211" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00ff87">+340% FASTER</text>
  </g>

  <!-- Bottom Badges / Terminal Bar -->
  <g transform="translate(80, 480)">
    <rect width="460" height="52" rx="10" fill="#0b0f19" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="22" y="32" font-family="'JetBrains Mono', monospace" font-size="15" fill="#00f2fe">$</text>
    <text x="44" y="32" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#ffffff">cargo add hyper64</text>
    <rect x="365" y="10" width="82" height="32" rx="6" fill="rgba(0,242,254,0.15)"/>
    <text x="382" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00f2fe">v0.2.0</text>
  </g>

  <!-- Footer Credits -->
  <text x="80" y="565" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#475569">
    © 2026 Andrés Antonio Cardoso — GLASTOR® Core Organization • Dual licensed MIT OR Apache-2.0
  </text>
  <text x="1120" y="565" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">
    crates.io/crates/hyper64 • github.com/glastor-core/hyper64
  </text>
</svg>

