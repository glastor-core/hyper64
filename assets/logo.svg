<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="logoBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(6, 6)">
    <rect width="58" height="58" rx="14" fill="url(#logoBg)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5"/>
    <polygon points="34,8 18,32 31,32 24,50 42,26 30,26" fill="url(#logoBolt)" filter="url(#logoGlow)"/>
    <polygon points="33,12 21,31 31,31 26,45 39,27 30,27" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 22)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#8b9bb4" letter-spacing="2">GLASTOR® CORE</text>
  </g>

  <g transform="translate(80, 52)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="-0.5">hyper</text>
    <text x="82" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="url(#brandGrad)" letter-spacing="-0.5">64</text>
  </g>

  <!-- Decorative Speed Accent Lines -->
  <line x1="205" y1="44" x2="225" y2="44" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="215" y1="49" x2="235" y2="49" stroke="#4facfe" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="225" y1="54" x2="240" y2="54" stroke="#7928ca" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
