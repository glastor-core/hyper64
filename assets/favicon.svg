<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#161f36"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Speed Track Sub-lines -->
  <line x1="12" y1="20" x2="22" y2="20" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="8" y1="32" x2="18" y2="32" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="12" y1="44" x2="24" y2="44" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- High-voltage Lightning Bolt Icon -->
  <polygon points="36,8 18,34 33,34 26,56 46,28 32,28" fill="url(#boltGrad)" filter="url(#neonGlow)"/>
  <polygon points="35,12 22,33 33,33 28,50 43,29 32,29" fill="#ffffff" opacity="0.25"/>
</svg>

