[package]
name = "hyper64"
version = "0.2.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Andrés Antonio Cardoso <glastor.info@gmail.com>", "GLASTOR® Core Organization"]
description = "Next-generation, ultra-fast, zero-allocation Base64 engine in Rust with AVX-512, AVX2, NEON, WASM SIMD128, and const fn support"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/glastor-core/hyper64"
homepage = "https://github.com/glastor-core/hyper64"
documentation = "https://docs.rs/hyper64"
keywords = ["base64", "simd", "encoding", "decoding", "performance"]
categories = ["encoding", "no-std", "cryptography"]
include = [
    "/src",
    "/tests",
    "/benches",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/CHANGELOG.md",
    "/SAFETY.md",
    "/CITATION.cff",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
simd = []
serde = ["dep:serde"]
tokio = ["dep:tokio", "std"]

[dependencies]
serde = { version = "1.0", default-features = false, optional = true, features = ["alloc"] }
tokio = { version = "1.0", default-features = false, optional = true, features = ["io-util"] }

[dev-dependencies]
criterion = "0.5"
base64 = "0.22"
tokio = { version = "1.0", features = ["rt", "macros", "io-util"] }

[[bench]]
name = "benchmarks"
harness = false
